<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<title>十三皇宮尊尚禮遇 | Palace Privilege</title>
<style>
*{box-sizing:border-box}
:root{--royal-gold:#BD9040;--royal-gold-dark:#9B7330;--deep:#241d15;--paper:#fffdf9;--ink:#2D2926;--muted:#796f63;--line:#e8dece;--bg:#F6F1E8}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"NSimSun","新宋体","STHeiti","华文黑体","PMingLiU","MingLiU",serif;min-height:100vh;padding:24px 16px 34px}
.wrap{max-width:470px;margin:0 auto}
.card{position:relative;overflow:hidden;background:#F6F1E8;color:#2D2926;border-radius:24px;padding:27px 26px 25px;min-height:306px;box-shadow:0 18px 50px rgba(45,41,38,.12);border:1px solid #BD9040}
.card:before{content:"";position:absolute;right:-92px;top:-105px;width:260px;height:260px;border:1px solid rgba(189,144,64,.20);border-radius:50%}
.card:after{content:"";position:absolute;right:-45px;top:-58px;width:166px;height:166px;border:1px solid rgba(189,144,64,.13);border-radius:50%}
.brand-zh{font-family:"NSimSun","新宋体","STHeiti","华文黑体","PMingLiU","MingLiU",serif;letter-spacing:5px;font-size:22px}
.brand-en{font-family:"Josefin Sans","Helvetica Neue",Arial,sans-serif;font-family:"Josefin Sans","Helvetica Neue",Arial,sans-serif;letter-spacing:3.2px;font-size:11px;color:#BD9040;margin-top:5px}
.tag{margin-top:28px;color:#BD9040;font-size:10.5px;letter-spacing:2px}
.name-label{font-size:10px;color:#BD9040;margin-top:19px;letter-spacing:1.2px}
.name{font-family:"NSimSun","新宋体","STHeiti","华文黑体","PMingLiU","MingLiU",serif;font-size:26px;margin-top:5px;letter-spacing:.3px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:23px;font-size:10.5px;color:#BD9040}
.meta strong{display:block;color:#2D2926;font-size:14px;margin-top:5px;font-weight:500;letter-spacing:.2px}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;margin-top:24px;gap:16px}
.status{font-size:11px;letter-spacing:1px;color:#BD9040;line-height:1.55}
#qrcode{background:white;padding:7px;border-radius:8px;width:94px;height:94px}
.section{background:var(--paper);border:1px solid rgba(189,144,64,.42);border-radius:18px;padding:22px;margin-top:16px;box-shadow:0 8px 26px rgba(70,43,38,.04)}
.section-title-zh{font-family:"NSimSun","新宋体","STHeiti","华文黑体","PMingLiU","MingLiU",serif;font-size:20px;color:#431322;letter-spacing:1px}
.section-title-en{font-family:"Josefin Sans","Helvetica Neue",Arial,sans-serif;font-family:"Josefin Sans","Helvetica Neue",Arial,sans-serif;font-size:11px;color:#9b7d5b;letter-spacing:1.8px;text-transform:uppercase;margin-top:3px;margin-bottom:16px}
.priv{padding:18px 0;border-top:1px solid var(--line)}
.priv:first-of-type{border-top:0;padding-top:0}
.priv-title-zh{font-weight:650;font-size:15px;color:#38282c;line-height:1.45}
.priv-title-en{font-family:"Josefin Sans","Helvetica Neue",Arial,sans-serif;font-size:12px;color:#81736f;margin-top:3px}
.benefit-zh{font-family:"NSimSun","新宋体","STHeiti","华文黑体","PMingLiU","MingLiU",serif;font-size:22px;color:var(--wine);margin-top:11px;line-height:1.45}
.benefit-en{font-family:"Josefin Sans","Helvetica Neue",Arial,sans-serif;font-family:"Josefin Sans","Helvetica Neue",Arial,sans-serif;font-size:15px;color:#6f263d;margin-top:2px;line-height:1.45}
.desc{font-size:12px;line-height:1.72;color:var(--muted);margin-top:9px}
.zhline{display:block;color:#5e5350}
.enline{display:block;color:#928682;margin-top:2px;font-size:11.5px}
.dates{font-size:11.5px;color:#7f736e;margin-top:10px;line-height:1.55}
.facts{margin-top:12px;border-top:1px solid #f0e7dc;padding-top:10px}
.fact{font-size:12px;line-height:1.62;color:#5f5551;margin:7px 0}
.fact b{color:#3e1221;font-weight:650}
.fact-en{font-family:"Josefin Sans","Helvetica Neue",Arial,sans-serif;display:block;color:#8b7f7a;font-size:11.2px;margin-top:1px}
.terms{margin-top:14px;border-top:1px solid var(--line);padding-top:11px}
.terms summary{cursor:pointer;list-style:none;font-size:12px;color:var(--wine);font-weight:650;padding:5px 0}
.terms summary::-webkit-details-marker{display:none}
.terms summary:after{content:"＋";float:right;font-size:16px;font-weight:400;line-height:12px}
.terms[open] summary:after{content:"−"}
.terms-body{font-size:11.7px;line-height:1.75;color:#756a66;padding-top:9px;white-space:pre-line}
.terms-en{font-family:"Josefin Sans","Helvetica Neue",Arial,sans-serif;display:block;color:#958983;margin-top:10px}
.wallet-btn{display:block;text-decoration:none;text-align:center;background:#111;color:#2D2926;border-radius:12px;padding:12px 14px;margin-top:14px;font-size:13px;font-weight:600}
.access-section{background:var(--paper);border:1px solid rgba(189,144,64,.42);border-radius:18px;padding:22px;margin-top:16px;box-shadow:0 8px 26px rgba(70,43,38,.04)}
.access-item{padding:16px;border:1px solid #eadfcf;border-radius:14px;background:#fffefa;margin-top:12px}
.access-name-zh{font-size:16px;font-weight:650;color:#38282c}
.access-name-en{font-family:"Josefin Sans","Helvetica Neue",Arial,sans-serif;font-size:11.5px;color:#81736f;margin-top:3px}
.access-granted{margin-top:10px;color:#2f6a42;font-size:13px;font-weight:650;letter-spacing:.4px}
.access-details{margin-top:9px;font-size:12px;line-height:1.65;color:#625852}
.access-details .en{display:block;font-family:"Josefin Sans","Helvetica Neue",Arial,sans-serif;font-size:10.8px;color:#8b817a;margin-top:1px}
.note{font-size:11px;line-height:1.75;color:#81746f;text-align:center;margin:17px 10px}
.note .en{font-family:"Josefin Sans","Helvetica Neue",Arial,sans-serif;display:block;color:#9a8d88;margin-top:3px;font-size:10.5px}
.error{max-width:470px;margin:80px auto;background:#fff;padding:30px;border-radius:18px;text-align:center;color:var(--wine);line-height:1.8}
</style>

<style id="v24-brand-overrides">
:root{--stephen-red:#FF0018;--royal-gold:#BD9040;--royal-black:#2D2926;--warm:#F6F1E8;}
body{background:var(--warm)!important;color:var(--royal-black)!important;}
.the13-brand-logo img{filter:none!important;}
.brand,.top,.header{background:var(--warm)!important;color:var(--royal-black)!important;}
.card,.panel,.member-card{border-color:rgba(189,144,64,.45)!important;box-shadow:0 18px 50px rgba(45,41,38,.10)!important;}
h1,h2,.title,.zh,.section-title{color:var(--royal-black);}
.status,.active,.benefit,.benefit-zh{color:var(--stephen-red)!important;}
button,.primary,.cta{background:var(--stephen-red)!important;color:#fff!important;}
small,.en{letter-spacing:.7px;}
</style>
</head>
<body>
<div class="the13-brand-logo" style="text-align:center;padding:22px 16px 10px;background:#F6F1E8">
  <img src="the13-logo.jpg" alt="十三皇宮 十三皇宮" style="width:120px;max-width:28vw;height:auto;display:inline-block">
</div>
<div id="app" class="wrap"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxdnu8gt-ryCQBBfFIHatvrVMouNy4_CNFrulN2zK8-geaaVwRoD_eZ3NwlcDFw7mHA/exec";
const VERIFY_URL="https://the13palace.github.io/vip-dining/verify.html";
const token=new URLSearchParams(location.search).get("t");
const app=document.getElementById("app");
const esc=(v)=>String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function datePair(p){
 if(!p.validFrom&&!p.validUntil)return "";
 const a=p.validFrom||"—"; const b=p.validUntil||"持續有效";
 return `<div class="dates"><b>有效期</b>：${esc(a)} – ${esc(b)}<span class="fact-en">Validity: ${esc(a)} – ${esc(p.validUntil||"Ongoing")}</span></div>`;
}
function facts(p){
 const rows=[];
 if(p.venueZh||p.venueEn) rows.push(`<div class="fact"><b>適用場所：</b>${esc(p.venueZh)}<span class="fact-en">Venue: ${esc(p.venueEn)}</span></div>`);
 if(p.eligibleItemsZh||p.eligibleItemsEn) rows.push(`<div class="fact"><b>適用商品：</b>${esc(p.eligibleItemsZh)}<span class="fact-en">Eligible Items: ${esc(p.eligibleItemsEn)}</span></div>`);
 if(p.excludedItemsZh||p.excludedItemsEn) rows.push(`<div class="fact"><b>不適用商品：</b>${esc(p.excludedItemsZh)}<span class="fact-en">Excluded Items: ${esc(p.excludedItemsEn)}</span></div>`);
 if(p.hoursZh||p.hoursEn) rows.push(`<div class="fact"><b>適用時段：</b>${esc(p.hoursZh)}<span class="fact-en">Applicable Hours: ${esc(p.hoursEn)}</span></div>`);
 return rows.length?`<div class="facts">${rows.join("")}</div>`:"";
}
function terms(p){
 if(!p.termsZh&&!p.termsEn)return "";
 const version=p.termsVersion?`<div class="dates">條款版本：${esc(p.termsVersion)}<span class="fact-en">Terms Version: ${esc(p.termsVersion)}</span></div>`:"";
 return `<details class="terms"><summary>查看條款及細則 <span style="font-weight:400;color:#9a858a">/ Terms & Conditions</span></summary><div class="terms-body">${esc(p.termsZh)}${p.termsZh&&p.termsEn?'<span class="terms-en">'+esc(p.termsEn)+'</span>':esc(p.termsEn)}</div>${version}</details>`;
}
async function load(){
 if(!token)return fail("會員連結無效。<br>Invalid membership link.");
 try{
  const r=await fetch(`${API_URL}?action=cardV2&t=${encodeURIComponent(token)}`,{cache:'no-store'});
  const x=await r.json();
  if(!x.success)return fail("未能載入會員資料。<br>"+esc(x.message||"Unable to load membership."));
  if(x.status!=="Active")return fail(`會員狀態：<strong>${esc(x.status)}</strong><br>如需協助，請聯絡 Palace Privilege。<br><span style="color:#857876">Membership status: ${esc(x.status)}. Please contact Palace Privilege for assistance.</span>`);
  const privs=(x.privileges||[]).map(p=>`<div class="priv">
    <div class="priv-title-zh">${esc(p.titleZh)}</div><div class="priv-title-en">${esc(p.titleEn)}</div>
    <div class="benefit-zh">${esc(p.benefitZh)}</div><div class="benefit-en">${esc(p.benefitEn)}</div>
    ${(p.descriptionZh||p.descriptionEn)?`<div class="desc"><span class="zhline">${esc(p.descriptionZh)}</span><span class="enline">${esc(p.descriptionEn)}</span></div>`:''}
    ${facts(p)}${datePair(p)}${terms(p)}</div>`).join("");
  const wallet=(x.wallet&&x.wallet.enabled&&x.wallet.appleUrl)?`<a class="wallet-btn" href="${esc(x.wallet.appleUrl)}">加入 Apple Wallet / Add to Apple Wallet</a>`:"";
  const access=(x.accessPermissions||[]).map(a=>{
    const validity=(a.validFrom||a.validUntil)?`<div class="access-details">有效期：${esc(a.validFrom||'—')} – ${esc(a.validUntil||'持續有效')}<span class="en">Validity: ${esc(a.validFrom||'—')} – ${esc(a.validUntil||'Ongoing')}</span></div>`:'';
    const guests=a.maxGuests>0?`<div class="access-details">可攜同賓客：${esc(a.maxGuests)} 位<span class="en">Accompanying Guests: ${esc(a.maxGuests)}</span></div>`:'';
    const hours=(a.hoursZh||a.hoursEn)?`<div class="access-details">適用時段：${esc(a.hoursZh)}<span class="en">Hours: ${esc(a.hoursEn)}</span></div>`:'';
    const limit=a.usageLimit?`<div class="access-details">使用限制：${esc(a.usageLimit)} ${esc(a.usagePeriod||'')}<span class="en">Usage Limit: ${esc(a.usageLimit)} ${esc(a.usagePeriod||'')}</span></div>`:'';
    return `<div class="access-item"><div class="access-name-zh">${esc(a.typeZh)}</div><div class="access-name-en">${esc(a.typeEn)}</div><div class="access-granted">✓ 可使用 · ACCESS GRANTED</div>${validity}${guests}${hours}${limit}</div>`;
  }).join("");
  app.innerHTML=`<div class="card">
    <div class="brand-zh">十三皇宮</div><div class="brand-en">THE 13 PALACE</div>
    <div class="tag">尊尚禮遇 · PALACE PRIVILEGE</div>
    <div class="name-label">會員姓名 / MEMBER NAME</div><div class="name">${esc(x.name)}</div>
    <div class="meta"><div>會員編號 / MEMBER NO.<strong>${esc(x.vipNo)}</strong></div><div>有效至 / VALID UNTIL<strong>${esc(x.expiryDate||"—")}</strong></div></div>
    <div class="bottom"><div class="status">有效會員<br>ACTIVE MEMBER</div><div id="qrcode"></div></div>
  </div>${wallet}
  ${access?`<section class="access-section"><div class="section-title-zh">專屬設施權限</div><div class="section-title-en">FACILITY ACCESS</div>${access}</section>`:''}
  <section class="section"><div class="section-title-zh">現行會員禮遇</div><div class="section-title-en">CURRENT PRIVILEGES</div>${privs||'<div class="desc"><span class="zhline">目前暫無適用禮遇。</span><span class="enline">No current privileges are available at this time.</span></div>'}</section>
  <div class="note">會員禮遇及條款或會不時更新，最新適用內容以本頁顯示為準。<span class="en">Privileges and terms may be updated from time to time. Please refer to this page for the latest applicable information.</span></div>`;
  new QRCode(document.getElementById("qrcode"),{text:`${VERIFY_URL}?t=${encodeURIComponent(token)}`,width:80,height:80});
 }catch(e){fail("未能載入會員資料。<br>Unable to load membership.")}
}
function fail(t){app.innerHTML=`<div class="error">${t}</div>`}
load();
</script>
</body>
</html>
