<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palace Privilege | 十三皇宮尊尚禮遇</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#efe9df;color:#261c1e;font-family:Arial,"PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh;padding:24px 16px}
.wrap{max-width:470px;margin:0 auto}
.card{position:relative;overflow:hidden;background:linear-gradient(145deg,#4b1128,#240913);color:#fff;border-radius:24px;padding:28px;min-height:300px;box-shadow:0 18px 50px rgba(52,13,28,.24);border:1px solid rgba(214,183,124,.5)}
.card:before{content:"";position:absolute;right:-90px;top:-110px;width:260px;height:260px;border:1px solid rgba(221,191,135,.19);border-radius:50%}
.brand{font-family:Georgia,"Times New Roman",serif;letter-spacing:3px;font-size:23px}
.cn{font-size:11px;letter-spacing:4px;color:#e0c79d;margin-top:3px}
.tag{margin-top:26px;color:#d9bc8d;font-size:10px;letter-spacing:2.2px}
.name{font-family:Georgia,"Times New Roman",serif;font-size:26px;margin-top:7px}
.meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:25px;font-size:11px;color:#ddcdbf}
.meta strong{display:block;color:#fff;font-size:14px;margin-top:4px;font-weight:400}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;margin-top:25px;gap:16px}
.status{font-size:11px;letter-spacing:1.4px;color:#dec48f}
#qrcode{background:white;padding:7px;border-radius:8px;width:94px;height:94px}
.section{background:#fffdf9;border:1px solid #d8cab5;border-radius:18px;padding:22px;margin-top:16px}
.section h3{font-family:Georgia,"Times New Roman",serif;font-size:18px;font-weight:400;margin:0 0 2px;color:#3e1221}
.zhheading{font-size:13px;color:#8a173b;margin-bottom:16px}
.priv{padding:17px 0;border-top:1px solid #eee3d5}
.priv:first-of-type{border-top:0;padding-top:0}
.priv-title{font-weight:600;font-size:14px}
.priv-zh{font-size:13px;color:#6d1532;margin-top:3px}
.benefit{font-family:Georgia,"Times New Roman",serif;font-size:19px;margin-top:9px}
.benefit-zh{font-size:14px;color:#6d1532;margin-top:3px}
.desc{font-size:12px;line-height:1.65;color:#776b67;margin-top:8px}
.dates{font-size:11px;color:#948781;margin-top:8px}
.facts{margin-top:11px;border-top:1px solid #f0e7dc;padding-top:9px}
.fact{font-size:11.5px;line-height:1.55;color:#5e5551;margin:4px 0}
.fact b{color:#3e1221;font-weight:600}
.terms{margin-top:12px;border-top:1px solid #eee3d5;padding-top:10px}
.terms summary{cursor:pointer;list-style:none;font-size:12px;color:#6d1532;font-weight:600;padding:4px 0}
.terms summary::-webkit-details-marker{display:none}
.terms summary:after{content:"＋";float:right;font-size:16px;font-weight:400;line-height:12px}
.terms[open] summary:after{content:"−"}
.terms-body{font-size:11.5px;line-height:1.7;color:#756a66;padding-top:8px;white-space:pre-line}
.wallet-btn{display:block;text-decoration:none;text-align:center;background:#111;color:#fff;border-radius:12px;padding:12px 14px;margin-top:14px;font-size:13px;font-weight:600}
.note{font-size:11px;line-height:1.7;color:#81746f;text-align:center;margin:17px 10px}
.error{max-width:470px;margin:80px auto;background:#fff;padding:30px;border-radius:18px;text-align:center;color:#6d1532;line-height:1.8}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxdnu8gt-ryCQBBfFIHatvrVMouNy4_CNFrulN2zK8-geaaVwRoD_eZ3NwlcDFw7mHA/exec";
const VERIFY_URL="https://the13palace.github.io/vip-dining/verify.html";
const token=new URLSearchParams(location.search).get("t");
const app=document.getElementById("app");
const esc=(v)=>String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function datePair(p) {
  if(!p.validFrom && !p.validUntil) return "";
  const a=p.validFrom || "—";
  const b=p.validUntil || "Ongoing / 持續有效";
  return `<div class="dates">Valid / 有效期：${esc(a)} – ${esc(b)}</div>`;
}

function facts(p){
  const rows=[];
  if(p.venueEn||p.venueZh) rows.push(`<div class="fact"><b>Venue / 適用場所：</b>${esc(p.venueEn)}${p.venueEn&&p.venueZh?' / ':''}${esc(p.venueZh)}</div>`);
  if(p.eligibleItemsEn||p.eligibleItemsZh) rows.push(`<div class="fact"><b>Eligible / 適用：</b>${esc(p.eligibleItemsEn)}${p.eligibleItemsEn&&p.eligibleItemsZh?' / ':''}${esc(p.eligibleItemsZh)}</div>`);
  if(p.excludedItemsEn||p.excludedItemsZh) rows.push(`<div class="fact"><b>Excluded / 不適用：</b>${esc(p.excludedItemsEn)}${p.excludedItemsEn&&p.excludedItemsZh?' / ':''}${esc(p.excludedItemsZh)}</div>`);
  if(p.hoursEn||p.hoursZh) rows.push(`<div class="fact"><b>Hours / 適用時段：</b>${esc(p.hoursEn)}${p.hoursEn&&p.hoursZh?' / ':''}${esc(p.hoursZh)}</div>`);
  return rows.length?`<div class="facts">${rows.join('')}</div>`:"";
}

function terms(p){
  if(!p.termsEn&&!p.termsZh) return "";
  const version=p.termsVersion?`<div class="dates">Terms version / 條款版本：${esc(p.termsVersion)}</div>`:"";
  return `<details class="terms">
    <summary>View Terms & Conditions / 查看條款及細則</summary>
    <div class="terms-body">${esc(p.termsEn)}${p.termsEn&&p.termsZh?'\n\n':''}${esc(p.termsZh)}</div>
    ${version}
  </details>`;
}

async function load() {
 if(!token) return fail("Invalid membership link.<br>會員連結無效。");
 try {
  const r=await fetch(`${API_URL}?action=cardV2&t=${encodeURIComponent(token)}`);
  const x=await r.json();
  if(!x.success) return fail((x.message||"Unable to load membership.")+"<br>未能載入會員資料。");
  if(x.status!=="Active") return fail(`Membership status / 會員狀態：<strong>${esc(x.status)}</strong><br>Please contact Palace Privilege if assistance is required.<br>如需協助，請聯絡 Palace Privilege。`);

  const privs=(x.privileges||[]).map(p=>`
   <div class="priv">
     <div class="priv-title">${esc(p.titleEn)}</div>
     <div class="priv-zh">${esc(p.titleZh)}</div>
     <div class="benefit">${esc(p.benefitEn)}</div>
     <div class="benefit-zh">${esc(p.benefitZh)}</div>
     ${(p.descriptionEn||p.descriptionZh)?`<div class="desc">${esc(p.descriptionEn)}${p.descriptionEn&&p.descriptionZh?'<br>':''}${esc(p.descriptionZh)}</div>`:''}
     ${datePair(p)}
     ${facts(p)}
     ${terms(p)}
   </div>`).join("");

  const wallet=(x.wallet&&x.wallet.enabled&&x.wallet.appleUrl)
    ? `<a class="wallet-btn" href="${esc(x.wallet.appleUrl)}">Add to Apple Wallet / 加入 Apple Wallet</a>` : "";

  app.innerHTML=`
   <div class="card">
    <div class="brand">THE 13 PALACE</div>
    <div class="cn">十三皇宮</div>
    <div class="tag">PALACE PRIVILEGE · 尊尚禮遇</div>
    <div class="name">${esc(x.name)}</div>
    <div class="meta">
      <div>MEMBER NO. / 會員編號<strong>${esc(x.vipNo)}</strong></div>
      <div>VALID UNTIL / 有效至<strong>${esc(x.expiryDate||"—")}</strong></div>
    </div>
    <div class="bottom">
      <div class="status">ACTIVE MEMBER · 有效會員</div>
      <div id="qrcode"></div>
    </div>
   </div>
   ${wallet}
   <section class="section">
     <h3>Current Privileges</h3>
     <div class="zhheading">現行會員禮遇</div>
     ${privs || '<div class="desc">No current privileges are available at this time.<br>目前暫無適用禮遇。</div>'}
   </section>
   <div class="note">
    Privileges and terms may be updated from time to time. Please refer to this page for the latest applicable information.<br>
    會員禮遇及條款或會不時更新，最新適用內容以本頁顯示為準。
   </div>`;

   new QRCode(document.getElementById("qrcode"), {
     text:`${VERIFY_URL}?t=${encodeURIComponent(token)}`,
     width:80,height:80
   });
 } catch(e) { fail("Unable to load membership.<br>未能載入會員資料。"); }
}
function fail(t){app.innerHTML=`<div class="error">${t}</div>`}
load();
</script>
</body>
</html>
